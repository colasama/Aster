capabilities = ["gpu_render"]

[plugin]
id = "org.aster.example.crt"
name = "Aster CRT"
version = "1.0.0"
api_version = 1
shader = "effect.wgsl"

[[parameters]]
type = "number"
name = "curvature"
label = "Curvature"
default = 0.08
min = 0.0
max = 0.3

[[parameters]]
type = "number"
name = "scanlines"
label = "Scanline Amount"
default = 0.18
min = 0.0
max = 1.0

[[parameters]]
type = "number"
name = "noise"
label = "Noise"
default = 0.025
min = 0.0
max = 0.25
