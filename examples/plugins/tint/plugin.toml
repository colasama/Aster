capabilities = ["gpu_render"]

[plugin]
id = "org.aster.example.tint"
name = "Aster Tint"
version = "1.0.0"
api_version = 1
shader = "effect.wgsl"

[[parameters]]
type = "number"
name = "amount"
label = "Amount"
default = 0.5
min = 0.0
max = 1.0

[[parameters]]
type = "color"
name = "color"
label = "Color"
default = [0.25, 0.55, 1.0, 1.0]
