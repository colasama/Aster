name = "tilt"
label = "Tilt dB per octave"
default = 2.0
min = -6.0
max = 9.0

# Slot 11
[[parameters]]
type = "number"
name = "curve"
label = "Curve"
default = 1.25
min = 0.25
max = 4.0

# Slot 12
[[parameters]]
type = "number"
name = "release"
label = "Release"
default = 0.12
min = 0.0
max = 0.25

# Slot 13
[[parameters]]
