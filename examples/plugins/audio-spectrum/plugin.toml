capabilities = ["gpu_compute", "gpu_render", "audio_analysis"]

[plugin]
id = "org.aster.example.audio-spectrum"
name = "Audio Spectrum"
version = "1.0.0"
api_version = 1
shader = "compute.wgsl"
kind = "scene_generator"

[scene_generator]
api_version = 1
node_type = "audio_spectrum"
capacity_parameter = "count"
max_instances = 2048
instance_stride = 64

[[scene_generator.compute_passes]]
id = "layout"
shader = "compute.wgsl"
entry_point = "compute_main"
workgroup_size = [64, 1, 1]
phase = "simulation"

[[scene_generator.render_variants]]
id = "spectrum"
shader = "render.wgsl"
vertex_entry = "vertex_main"
fragment_entry = "fragment_main"
vertex_count = 6
blend = "layer"
depth = "none"
cull = "none"

# Slot 0
[[parameters]]
type = "choice"
name = "style"
label = "Style"
default = "bars"
choices = ["bars", "mirror", "ring", "line", "scope", "dots"]

# Slot 1
[[parameters]]
type = "number"
name = "count"
label = "Bars"
default = 64.0
min = 2.0
max = 2048.0

# Slot 2
[[parameters]]
type = "number"
name = "width"
label = "Width"
default = 1200.0
min = 16.0
max = 8192.0

# Slot 3
[[parameters]]
type = "number"
name = "height"
label = "Height"
default = 320.0
min = 4.0
max = 4096.0

# Slot 4
[[parameters]]
type = "number"
name = "radius"
label = "Ring radius"
default = 220.0
min = 0.0
max = 4096.0

# Slot 5
[[parameters]]
type = "number"
name = "fill"
label = "Bar fill"
default = 0.62
min = 0.05
max = 1.0

# Slot 6
[[parameters]]
type = "number"
name = "line_width"
label = "Line width"
default = 4.0
min = 0.5
max = 128.0

# Slot 7
[[parameters]]
type = "number"
name = "roundness"
label = "Roundness"
default = 1.0
min = 0.0
max = 1.0

# Slot 8
[[parameters]]
type = "number"
name = "floor"
label = "Floor"
default = 0.42
min = 0.0
max = 1.0

# Slot 9
[[parameters]]
type = "number"
name = "ceiling"
label = "Ceiling"
default = 0.82
min = 0.0
max = 1.0

# Slot 10
