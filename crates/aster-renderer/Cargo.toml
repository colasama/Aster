[package]
name = "aster-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aster-render.workspace = true
aster-render-ir.workspace = true
aster-shaders.workspace = true
aster-text.workspace = true
clap.workspace = true
sha2.workspace = true
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu = { workspace = true, features = ["naga-ir"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[dev-dependencies]
aster-media-native.workspace = true
aster-video.workspace = true
exr.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi"] }

[target.'cfg(target_os = "macos")'.dependencies]
aster-macos.workspace = true
objc2 = "0.6.4"
objc2-metal = "0.3.2"
