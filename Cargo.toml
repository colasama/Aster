[workspace]
resolver = "3"
members = [
  "crates/aster-ai",
  "crates/aster-core",
  "crates/aster-plugin",
  "crates/aster-profiler",
  "crates/aster-project",
  "crates/aster-render",
  "crates/aster-scene",
  "crates/aster-timeline",
  "crates/aster-text",
  "crates/aster-video",
  "src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
description = "GPU-first motion graphics and compositing editor"
license = "MPL-2.0"
repository = "https://github.com/aster-mograph/aster"
rust-version = "1.97"

[workspace.dependencies]
aster-ai = { path = "crates/aster-ai", version = "0.2.0" }
aster-core = { path = "crates/aster-core", version = "0.2.0" }
aster-plugin = { path = "crates/aster-plugin", version = "0.2.0" }
aster-profiler = { path = "crates/aster-profiler", version = "0.2.0" }
aster-project = { path = "crates/aster-project", version = "0.2.0" }
aster-render = { path = "crates/aster-render", version = "0.2.0" }
aster-scene = { path = "crates/aster-scene", version = "0.2.0" }
aster-timeline = { path = "crates/aster-timeline", version = "0.2.0" }
aster-text = { path = "crates/aster-text", version = "0.2.0" }
aster-video = { path = "crates/aster-video", version = "0.2.0" }
base64 = "0.22.1"
glam = { version = "0.33.5", features = ["serde"] }
indexmap = { version = "2.14.0", features = ["serde"] }
naga = { version = "30.0.0", features = ["wgsl-in"] }
parking_lot = "0.12.5"
pollster = "0.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.20"
toml = "1.1.4"
uuid = { version = "1.24.1", features = ["serde", "v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
wgpu = "30.0.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2
