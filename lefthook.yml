pre-commit:
  parallel: true
  commands:
    frontend:
      glob: "*.{ts,tsx,js,jsx,json,css,html,md,yml,yaml}"
      run: pnpm exec biome check --no-errors-on-unmatched --vcs-enabled=true --vcs-client-kind=git --staged
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    clippy:
      glob: "*.{rs,toml}"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
    typecheck:
      glob: "*.{ts,tsx,cts,mts,json}"
      run: pnpm typecheck
