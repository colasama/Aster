[advisories]
yanked = "deny"
ignore = [
  # exr 1.74.2 -> pulp 0.22.3 still requires this build-time macro crate.
  # Remove when exr adopts a published pulp release using pastey.
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, with no reported vulnerability or patched version; the compatible exr/pulp releases still require it" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
