name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-artifacts-quality
      - run: pnpm install --frozen-lockfile
      - name: Check Rust formatting and lint
        run: pnpm exec lefthook run pre-commit --force --command rustfmt --command clippy
      - name: Check frontend and Rust tests
        run: pnpm exec lefthook run pre-push --force
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  bundle:
    name: Bundle ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            builder_args: --linux AppImage deb --x64
            artifact: aster-linux-x64
            binary_dir: release/linux-unpacked/resources/bin
          - name: Windows x64
            os: windows-latest
            builder_args: --win nsis --x64
            artifact: aster-windows-x64
            binary_dir: release/win-unpacked/resources/bin
          - name: macOS universal
            os: macos-15
            builder_args: --mac dmg zip --universal -c.mac.identity=- -c.mac.hardenedRuntime=false
            artifact: aster-macos-universal
            binary_dir: release/mac-universal/Aster.app/Contents/Resources/bin
            ffmpeg_args: --universal
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install universal Apple Rust targets
        if: matrix.name == 'macOS universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-artifacts-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools
      - uses: actions/cache@v4
        with:
          path: |
            .aster-cache/ffmpeg/*.gz
            .aster-cache/ffmpeg/*.zip
            .aster-cache/ffmpeg/*.LICENSE
            .aster-cache/ffmpeg/*.README
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg-downloads.json') }}
      - name: Download and stage pinned FFmpeg and FFprobe
        run: pnpm artifact:download-ffmpeg ${{ matrix.ffmpeg_args }}
      - name: Build frontend and native bridge
        if: matrix.name != 'macOS universal'
        run: pnpm build
      - name: Build universal macOS assets and bridge
        if: matrix.name == 'macOS universal'
        shell: bash
        run: |
          pnpm typecheck
          pnpm exec vite build
          pnpm electron:compile
          cargo build --release -p aster-desktop-bridge --target aarch64-apple-darwin
          cargo build --release -p aster-desktop-bridge --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/aster-desktop-bridge \
            target/x86_64-apple-darwin/release/aster-desktop-bridge \
            -output target/release/aster-desktop-bridge
          lipo -create \
            target/aarch64-apple-darwin/release/aster-mcp \
            target/x86_64-apple-darwin/release/aster-mcp \
            -output target/release/aster-mcp
          codesign --force --sign - target/release/aster-desktop-bridge
          codesign --force --sign - target/release/aster-mcp
      - name: Package desktop bundles
        run: pnpm exec electron-builder --config scripts/electron-builder.ts --publish never ${{ matrix.builder_args }}
      - name: Verify packaged tools and generate checksums
        run: node scripts/verify-desktop-bundle.mjs "${{ matrix.binary_dir }}" ${{ matrix.ffmpeg_args }}
      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
