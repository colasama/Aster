name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-artifacts-quality
      - run: pnpm install --frozen-lockfile
      - name: Check frontend formatting, types, and tests
        run: pnpm check:frontend
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint all Rust targets and features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test all Rust features
        run: cargo test --workspace --all-features

  bundle:
    name: Bundle ${{ matrix.name }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            builder_args: --linux AppImage deb --x64
            artifact: aster-linux-x64
          - name: Windows x64
            os: windows-latest
            builder_args: --win nsis --x64
            artifact: aster-windows-x64
          - name: macOS universal
            os: macos-14
            artifact: aster-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install universal Apple Rust targets
        if: matrix.name == 'macOS universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-artifacts-${{ runner.os }}
      - run: pnpm install --frozen-lockfile
      - name: Build desktop bundles
        if: matrix.name != 'macOS universal'
        shell: bash
        run: pnpm artifact:build -- ${{ matrix.builder_args }}
      - name: Build universal macOS assets and bridge
        if: matrix.name == 'macOS universal'
        shell: bash
        run: |
          pnpm typecheck
          pnpm exec vite build
          pnpm electron:compile
          cargo build --release -p aster-desktop-bridge --target aarch64-apple-darwin
          cargo build --release -p aster-desktop-bridge --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/aster-desktop-bridge \
            target/x86_64-apple-darwin/release/aster-desktop-bridge \
            -output target/release/aster-desktop-bridge
          pnpm exec electron-builder --mac --universal
      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: release/**/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
